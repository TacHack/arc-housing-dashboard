name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sober
          POSTGRES_PASSWORD: sober
          POSTGRES_DB: sober_living_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sober -d sober_living_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sober:sober@localhost:5432/sober_living_crm?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm run build
