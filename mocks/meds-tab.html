<html><head><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800">
<div class="flex min-h-screen"><aside class="w-56 bg-slate-900 text-slate-200 p-5 space-y-2 text-sm"><div class="text-xs font-semibold tracking-wide text-slate-400">SOBER LIVING CRM</div><div class="font-semibold text-white mb-4">Operations console</div><div>Dashboard</div><div>Houses</div><div class="text-white font-medium">Residents</div><div>Work orders</div></aside>
<main class="flex-1 p-8 max-w-4xl"><div class="text-xs text-slate-400">Summit Recovery Homes</div><h1 class="text-2xl font-semibold mb-4">Jane Doe</h1>
<div class="flex gap-2 border-b border-slate-200 mb-6"><a class="px-4 py-2 text-sm text-slate-500">Client folder</a><a class="px-4 py-2 text-sm font-medium border-b-2 border-teal-600 text-teal-700">Meds</a></div>
<div class="space-y-6"><section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm"><h2 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-4">Add medication</h2><div class="grid sm:grid-cols-2 gap-4">
<label class="sm:col-span-2 text-sm">Description (medication name) *<input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></label>
<label class="text-sm">Dosage<input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></label><label class="text-sm">Amount<input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"></label></div></section>
<button class="rounded-lg bg-teal-600 px-4 py-2 text-sm font-medium text-white">Add med</button>
<section class="rounded-xl border border-slate-200 bg-white shadow-sm"><h2 class="px-5 pt-5 text-xs font-semibold uppercase tracking-wide text-slate-400">Medications</h2>
<table class="mt-3 w-full text-sm"><thead class="border-b border-slate-200 text-left text-xs uppercase tracking-wide text-slate-400"><tr><th class="px-5 py-2">Description</th><th class="px-5 py-2">Dosage</th><th class="px-5 py-2">Amount</th><th class="px-5 py-2">Status</th><th></th></tr></thead>
<tbody class="divide-y divide-slate-100"><tr><td class="px-5 py-2 font-medium">Naltrexone</td><td class="px-5 py-2">50 mg</td><td class="px-5 py-2">1 tablet daily</td><td class="px-5 py-2"><span class="rounded-full px-2 py-0.5 text-xs bg-teal-50 text-teal-700">Active</span></td><td class="px-5 py-2 text-right"><button class="rounded-lg border border-red-300 px-4 py-2 text-sm text-red-700">Deactivate</button></td></tr>
<tr class="text-slate-400"><td class="px-5 py-2 font-medium">Sertraline</td><td class="px-5 py-2">25 mg</td><td class="px-5 py-2">—</td><td class="px-5 py-2"><span class="rounded-full px-2 py-0.5 text-xs bg-slate-100 text-slate-500">Inactive</span></td><td class="px-5 py-2 text-right"><button class="rounded-lg border border-slate-300 px-4 py-2 text-sm text-slate-700">Reactivate</button></td></tr></tbody></table></section></div></main></div></body></html>
